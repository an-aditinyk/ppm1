[project]
name = "tallyimporter"
version = "0.1.0"
description = "Source-agnostic accounting data to verified Tally import XML."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "lxml>=5.2",
]

[project.scripts]
tallyimporter = "tallyimporter.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.5",
    "import-linter>=2.0",
    "lxml-stubs>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tallyimporter"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_explicit = true
mypy_path = "src"
packages = ["tallyimporter"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
# Generate a fully-typed __init__ so models satisfy disallow_any_explicit
# (otherwise the synthesized **data: Any trips the strict flag).
init_typed = true
init_forbid_extra = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_any_explicit = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.pytest.ini_options]
addopts = "--cov=src/tallyimporter --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/tallyimporter"]
